    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'" transform="translate(15.4026 129.206168)">   sur le coût</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'" transform="translate(15.4026 138.03116)">4 balises naturelles ;</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'" transform="translate(15.4026 147.16773)">   adaptateur témoin</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'" transform="translate(15.4026 156.34473)">5 accord une passe /</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'" transform="translate(15.4026 166.328168)">   raisonnement</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'" transform="translate(15.4026 175.11273)">6 surcoûts nus / justifiés</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'" transform="translate(15.4026 184.42773)">7 actions non appliquées</text>
