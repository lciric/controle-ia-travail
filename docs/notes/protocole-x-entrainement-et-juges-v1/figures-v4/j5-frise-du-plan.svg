    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'" transform="translate(15.4026 91.808168)">   maximum atteint</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'" transform="translate(15.4026 100.59273)">2 aire sur les pas où</text>
