   <g id="text_1">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(38.428928 95.141275)">signal</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(18.021178 104.983517)">(note d'un juge,</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(16.800147 115.153759)">démonstrations)</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(186.471234 100.226396)">entraîner le</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(170.265344 110.396638)">modèle soupçonné</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(361.473603 100.226396)">modèle</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(358.957228 110.396638)">corrigé ?</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="56.7504" y="48.693761" transform="rotate(-0 56.7504 48.693761)">1</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(69.138 44.439128)">Orienter : quelles actions entraîner</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(69.138 53.081097)">plus fort (Hebbar)</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="292.1148" y="48.693761" transform="rotate(-0 292.1148 48.693761)">2</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(304.5024 44.439128)">Valider : ce que l'entraînement</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(304.5024 53.081097)">a obtenu (Taylor et al., p. 25)</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="56.7504" y="168.998561" transform="rotate(-0 56.7504 168.998561)">3</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(69.138 160.278944)">Garder ses suppositions : entraînement</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(69.138 169.208912)">indiscernable du service ; pas de frein à</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(69.138 177.850881)">l'exploration (Ryd et al. ; Jang et al.)</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="267.3396" y="168.998561" transform="rotate(-0 267.3396 168.998561)">4</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(279.7272 160.278944)">Tenir sous l'entraînement : dérive des</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(279.7272 169.208912)">sondes hors domaine ; politique entraînée</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(279.7272 177.850881)">contre le moniteur (Taufeeque ; Mallen)</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="213.66" y="13.758719" transform="rotate(-0 213.66 13.758719)">Les quatre endroits où la lignée du papier garde une détection</text>
   </g>
  </g>
 </g>
