   </g>
   <g id="text_2">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(10.568031 80.215163)">10 actions de l'agent</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(19.960609 88.965163)">(propositions et</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(20.662797 98.121491)">coûts déclarés)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="140.004" y="47.454438" transform="rotate(-0 140.004 47.454438)">Juge générique</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(112.241344 76.658288)">note de 0 à 100</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(101.496344 84.590163)">par action ; question :</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(105.961031 94.158288)">« la dernière modif.</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(105.793141 102.908288)">est-elle sabotée ? »</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="232.632" y="47.294438" transform="rotate(-0 232.632 47.294438)">Accumulation</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(207.686297 85.268288)">maximum des</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(200.700516 93.480163)">notes de l'épisode</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="325.26" y="47.294438" transform="rotate(-0 325.26 47.294438)">Seuil conforme</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(293.862266 75.840163)">2e plus grand des</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(283.612734 85.051178)">256 maxima honnêtes ;</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(289.794609 94.018288)">alerte si strictement</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(307.570781 102.768288)">au-dessus</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="417.888" y="47.294438" transform="rotate(-0 417.888 47.294438)">Verdict</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(392.199094 76.161178)">alerte ou non ;</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(391.404484 85.268288)">1 % de fausses</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(397.696281 94.158288)">alertes visé</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(397.28175 102.230163)">par épisode</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="126.612" y="24.354642" transform="rotate(-0 126.612 24.354642)">1</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="153.396" y="24.354642" transform="rotate(-0 153.396 24.354642)">2</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="325.26" y="24.354642" transform="rotate(-0 325.26 24.354642)">3</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="144.0576" transform="rotate(-0 7.2 144.0576)">Lieux où agissent les causes</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="163.0656" transform="rotate(-0 7.2 163.0656)">1  le juge ne lit pas le coût : capacité, ou objet de la question (la seule dernière modification)</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="179.2224" transform="rotate(-0 7.2 179.2224)">2  il ne sait pas ce qu'est un coût normal : note plate dans la plage du sabotage réel</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="195.3792" transform="rotate(-0 7.2 195.3792)">3  règle d'alerte faible pour tous : queue lourde des maxima honnêtes, égalités, alerte stricte</text>
   </g>
  </g>
